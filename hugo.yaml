baseURL: "https://iam.ninja/"
title: "Prithvi Poreddy"
pagination:
  pagerSize: 10
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON # enables Fuse.js-based search (out of the box)

params:
  env: production
  title: "Prithvi Poreddy"
  description: "Identity Security | Product Leader | Identity & Access Management | AI Security Strategy"
  author: "Prithvi Poreddy"
  defaultTheme: auto # auto switches between light/dark based on system
  ShowReadingTime: true
  ShowBreadCrumbs: false
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  UseHugoToc: true
  ShowToc: true
  TocOpen: false
  comments: false
  assets:
    disableHLJS: false # Keep syntax highlighting on
    disableFingerprinting: true
  label: #image next to name on home page
    text: "Prithvi Poreddy"
    icon: "/images/bw-logo.jpg" # path to your logo
    iconHeight: 32 # size in pixels

  images: ["/images/my-profile-pic.jpg"]

  openGraph:
    type: website
    image: "/images/my-profile-pic.jpg"
    title: "Prithvi Poreddy — Identity Security & AI Governance"
    description: "Product leader building trustworthy systems for humans and machines."

  twitterCards:
    card: summary_large_image
    image: "/images/my-profile-pic.jpg"

  # Home Info section (like PaperMod demo)
  homeInfoParams:
    Title: "Prithvi Poreddy"
    Eyebrow: "Identity Security · IAM · AI Governance"
    Avatar: "/images/bw-logo.jpg"
    LatestLabel: "Latest writing"
    Buttons:
      - name: "Read the posts →"
        url: "/posts/"
        primary: true
      - name: "About me"
        url: "/about/"
    Content: >
      Product leader in Identity Security & AI Governance, building trustworthy systems for humans & machines while sharing insights on technology, risk, and design.

  # Social Icons (show below intro)
  socialIcons:
    - name: github
      url: "https://github.com/prithvikrishnab4u"
    - name: linkedin
      url: "https://linkedin.com/in/pporeddy"

menu:
  main:
    - identifier: about
      name: "About"
      url: "/about/"
      weight: 1
    - identifier: posts
      name: "Posts"
      url: "/posts/"
      weight: 10
    - identifier: topics
      name: "Topics"
      url: "/categories/"
      weight: 20
    # Tags and Archive pages still exist; they're just not in the menu.
    # Search shows as an icon; the label is kept for screen readers.
    - identifier: search
      name: "Search"
      url: "/search/"
      weight: 40
      pre: '<svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.35-4.35"/></svg><span class="visually-hidden">'
      post: '</span>'

taxonomies:
  category: "categories"
  tag: "tags"
  series: "series"

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true
